[pytest]
addopts = -p no:cacheprovider
markers =
	lowmem: runs chromap's --low-mem path with BED or TagAlign output (also --preset atac and --preset chip); at 949043c each such run takes about 3 s and 12 GB of memory
	cpp: builds and runs a C++ unit-test driver from tests/cpp with the Makefile's compiler
